  <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const subjects = data.subjects;
    let activeSubject = subjects[0].key;
    let questions = [];
    let answers = {};
    let qaOpen = {};
    let submitted = false;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function newRound() {
      const subject = subjects.find((s) => s.key === activeSubject);
      submitted = false;
      answers = {};
      qaOpen = {};

      if (subject.mode === "qa") {
        questions = [...subject.questions];
        questions.forEach((q) => { qaOpen[q.id] = false; });
      } else {
        questions = shuffle(subject.questions).map(q => {
          const indexed = q.options.map((text, i) => ({ text, ok: i === q.correct }));
          const opts = shuffle(indexed);
          return {
            id: q.id,
            text: q.text,
            options: opts.map(o => o.text),
            correct: opts.findIndex(o => o.ok)
          };
        });
        questions.forEach(q => { answers[q.id] = null; });
      }
      render();
    }

    function answeredCount() {
      return questions.filter(q => answers[q.id] !== null).length;
    }

    function render() {
      const app = document.getElementById("app");
      const total = questions.length;
      const done = answeredCount();
      const score = questions.filter(q => answers[q.id] === q.correct).length;
      const pct = total ? Math.round(score / total * 100) : 0;
      const subject = subjects.find((s) => s.key === activeSubject);
      const isQaMode = subject.mode === "qa";

      let html = `<div class="tabs">`;
      const topTabs = subjects.filter((s) => s.key !== "brat");
      const bottomTab = subjects.find((s) => s.key === "brat");

      html += `<div class="tabs-row">`;
      topTabs.forEach((s) => {
        html += `<button class="tab ${s.key === activeSubject ? "active" : ""}" onclick="setSubject('${s.key}')">${s.title}</button>`;
      });
      html += `</div>`;
      if (bottomTab) {
        html += `<div class="tabs-row"><button class="tab ${bottomTab.key === activeSubject ? "active" : ""}" onclick="setSubject('${bottomTab.key}')">${bottomTab.title}</button></div>`;
      }
      html += `</div>`;

      let html2 = `<header class="header"><h1>${subject.title}</h1>`;
      if (isQaMode) {
        html2 += `<p class="progress">Kliknij pytanie, aby pokazać lub ukryć odpowiedź</p>`;
      } else if (!submitted) {
        html2 += `<p class="progress">Odpowiedziano: ${done} / ${total}</p>
          <div class="bar"><div class="bar-fill" style="width:${done/total*100}%"></div></div>`;
      } else {
        html2 += `<p class="progress">Wynik quizu</p>`;
      }
      html2 += `</header>`;
      html += html2;

      if (isQaMode) {
        html += `<div class="qa-controls">
          <button class="btn btn-main" onclick="showAllAnswers()">Pokaż wszystko</button>
          <button class="btn btn-sec" onclick="hideAllAnswers()">Schowaj wszystko</button>
        </div>`;
      }

      if (!isQaMode && submitted) {
        const msg = pct === 100 ? "Świetnie! Wszystkie odpowiedzi poprawne."
          : pct >= 70 ? "Dobry wynik! Sprawdź pytania z błędami poniżej."
          : "Warto powtórzyć materiał. Zobacz poprawne odpowiedzi poniżej.";
        html += `<div class="result"><h2>Twój wynik</h2>
          <div class="score">${score} / ${total}</div>
          <p>${pct}%</p><p>${msg}</p>
          <button class="btn btn-sec" onclick="newRound()">Rozpocznij od nowa</button></div>`;
      }

      questions.forEach((q, n) => {
        if (isQaMode) {
          const open = qaOpen[q.id];
          const preview = q.text.length > 95 ? `${q.text.slice(0, 95)}...` : q.text;
          html += `<div class="card"><div class="num">Pytanie ${n + 1}</div>
            <p class="qtext">${preview}</p>
            ${open ? `<div class="qa-answer">${q.answer}</div>` : ""}
            <button class="btn btn-sec qa-toggle" onclick="toggleAnswer(${q.id})">${open ? "Ukryj odpowiedź" : "Pokaż odpowiedź"}</button>
          </div>`;
        } else {
          const sel = answers[q.id];
          const ok = sel === q.correct;
          let cls = "card";
          if (submitted && sel !== null) cls += ok ? " ok" : " bad";
          html += `<div class="${cls}"><div class="num">Pytanie ${n + 1}</div>
            <p class="qtext">${q.text}</p><ul class="opts">`;
          q.options.forEach((opt, i) => {
            let ocls = "opt";
            if (!submitted && sel === i) ocls += " sel";
            if (submitted && i === q.correct) ocls += " ok";
            if (submitted && sel === i && i !== q.correct) ocls += " bad";
            const dis = submitted ? "disabled" : "";
            html += `<li><label class="${ocls}">
              <input type="radio" name="q${q.id}" ${sel===i?"checked":""} ${dis}
                onclick="pick(${q.id},${i})"><span>${opt}</span></label></li>`;
          });
          html += `</ul></div>`;
        }
      });

      if (!isQaMode && !submitted) {
        html += `<div class="submit-area">
          <button class="btn btn-main" ${done<total?"disabled":""} onclick="check()">Sprawdź wynik</button>
          ${done<total?'<p class="hint">Odpowiedz na wszystkie pytania</p>':""}
        </div>`;
      }

      app.innerHTML = html;
    }

    function pick(id, i) {
      if (submitted) return;
      answers[id] = i;
      render();
    }

    function check() {
      if (answeredCount() < questions.length) return;
      submitted = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function toggleAnswer(questionId) {
      qaOpen[questionId] = !qaOpen[questionId];
      render();
    }

    function showAllAnswers() {
      questions.forEach((q) => { qaOpen[q.id] = true; });
      render();
    }

    function hideAllAnswers() {
      questions.forEach((q) => { qaOpen[q.id] = false; });
      render();
    }

    function setSubject(subjectKey) {
      if (activeSubject === subjectKey) return;
      activeSubject = subjectKey;
      newRound();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    newRound();
  </script>
</body>
</html>
